services:
  web:
    build: .
    container_name: paloma_api_web
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
    command: >
      sh -c "python manage.py migrate &&
             gunicorn core_api.wsgi:application --bind 0.0.0.0:8000 --reload"